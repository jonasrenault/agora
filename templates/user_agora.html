{% extends "dashboard_base.html" %}

{% block title %}Agora | Settings{% endblock %}
{% block nav_title %}Agora | Settings{% endblock %}

{% block dashboard_content %}
<div class="mt-20 flex flex-col items-center justify-center">
    <div class="max-w-md w-full">
        <div class="p-6 rounded-lg bg-white md:p-6 dark:bg-neutral-800 dark:border-neutral-700">
            <h1 class="text-slate-900 text-center text-2xl font-bold dark:text-slate-50">Agora Settings</h1>

            <form class="space-y-6 mt-10" method="POST" action="/api/v1/agora/settings">
                <div>
                    <label for="email"
                        class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50">Agora
                        Email</label>
                    <input type="email" id="email" name="agora_email" placeholder="john@agora.fr"
                        value="{{ user.agora_email }}"
                        class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-600" />
                </div>
                <div>
                    <label for="password"
                        class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50">Agora
                        Password</label>
                    <input type="password" id="password" name="agora_password" placeholder="••••••••"
                        class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-600" />
                </div>
                <div>
                    <label for="agora_slots"
                        class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50">Agora
                        Slots</label>
                    <input type="text" id="slots" name="agora_slots" placeholder="19/10/2026, 20/10/2026"
                        value="{{ user.agora_slots }}"
                        class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-600" />
                </div>


                <button type="submit"
                    class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    Update settings</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
