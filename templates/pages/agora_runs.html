{% extends "layouts/dashboard_base.html" %}

{% block title %}Agora | Runs{% endblock %}

{% block dashboard_content %}
<div class="mt-4 flex flex-col items-center justify-center">
    <h1 class="text-center text-xl font-bold mb-5">Agora Portal Automation Runs</h1>

    <form class="mb-5 self-start mx-6 flex flex-col items-center" hx-post="{{ url_for('book') }}"
        hx-target="#agora-runs" hx-swap="innerHTML">
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-64 border p-4 mb-2">
            <legend class="fieldset-legend">Run options</legend>
            <label class="label">
                <input type="checkbox" checked="checked" value="True" class="checkbox checkbox-sm" name="headless" />
                Headless
            </label>
            <label class="label">
                <input type="checkbox" checked="checked" value="True" class="checkbox checkbox-sm" name="dry_run" />
                Dry Run
            </label>
        </fieldset>

        <button type="submit" class="btn btn-primary w-full mt-2">
            <span id="runs-spinner" class="loading loading-spinner htmx-indicator"></span>
            Run Automation
        </button>
    </form>

    <div class="w-full px-2">
        <ul class="list" id="agora-runs">
            {% include "components/_runs.html" %}
        </ul>
    </div>
</div>
{% endblock %}
