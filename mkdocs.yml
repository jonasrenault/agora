site_name: Agora
site_description: Réservation automatique de créneaux sur Agora Plus.
# site_url: https://inria-defense.github.io/vox-audio/
nav:
    - Home: index.md
    - Google: google.md
    - Redis: redis.md
    - Docker: docker.md
    - Railway: railway.md
theme:
  name: 'material'
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue-grey
    accent: indigo
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue-grey
    accent: indigo
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
repo_name: jonasrenault/agora
repo_url: https://github.com/jonasrenault/agora
