name: Test

on:
  # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env: # environment variables (available in any part of the action)
  PYTHON_VERSION: 3.12

jobs:
  lint-test:
    name: Run Python linters & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run black
        run: uv run --group dev black --check --config ./pyproject.toml .

      - name: Run mypy
        run: uv run --group dev mypy --config-file=pyproject.toml

      - name: Run ruff
        run: uv run --group dev ruff check

      #   - name: Test with pytest
      #     run: uv run --group dev pytest

      # Using uv cache prune --ci at the end of the job is recommended to reduce cache size.
      - name: Cache prune
        run: uv cache prune --ci
